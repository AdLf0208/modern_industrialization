id = "modern_industrialization"
name = "Modern Industrialization"
version = "0.2.0"
description = """A port of Modern Industrialization for Horizon: the electric macerator, the first machine of
the mod's electric age. The block carries a 32,000 FE buffer, one item input slot and four item output
slots, and runs upstream's CrafterComponent tick at the LV tier, so a recipe costs eu * duration EU
and an earned overclock tick speeds it up without making it cheaper. Thirty-three of the jar's own
macerator recipes are carried, the block and its nine dusts load from this package's own content, and
/modern_industrialization reports a machine's buffer, progress and efficiency. The other machine
families, the multiblocks, the generators and the pipes are not ported yet."""
authors = ["Azercoco", "Technici4n", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside
# the data/ and assets/ of the same package. The id is the resource namespace and the only identity.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds": the macerator
# block and its nine dusts are declarations under data/modern_industrialization/.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
